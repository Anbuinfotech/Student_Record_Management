spring.application.name=student-record-management

# Server port (Render/Railway inject PORT env var)
server.port=${PORT:8080}

# MySQL connection - set these as environment variables on your host
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_records}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS - set to your Vercel frontend URL in production
app.cors.allowed-origins=${CORS_ORIGINS:*}
